<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scentcast</title>
  <meta name="description" content="What to wear today from your own fragrance collection, based on the weather and the occasion.">
  <meta name="theme-color" content="#0b0c11">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scentcast">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="app">
    <header id="hero" class="hero"></header>
    <nav class="tabs" role="tablist" aria-label="View">
      <button role="tab" data-view="today" aria-selected="true">Today</button>
      <button role="tab" data-view="occasion" aria-selected="false">Occasion</button>
    </nav>
    <main id="view"></main>
    <footer id="foot"></footer>
  </div>
  <div id="sheet" class="sheet" hidden></div>
</body>
</html>
